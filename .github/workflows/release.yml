# Publishes a new version of Orbit in one step.
#
# On GitHub: Actions → "Release" → Run workflow → type the version (e.g. 0.1.2) → Run.
#
# It raises the version number, turns the CHANGELOG's "(unreleased)" section into the release
# notes, builds the APK signed with Orbit's key (checking it's the same key as v0.1.0, so it
# installs over earlier versions), and only then commits the new version number, tags it and
# publishes the GitHub release with the APK attached. If anything fails, nothing is committed.
#
# (A release made by a workflow doesn't start other workflows, so this one builds the APK itself
# rather than relying on android.yml's "release published" trigger.)
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, like 0.1.2 (the CHANGELOG needs a '## … (unreleased)' section)"
        required: true

permissions:
  contents: write   # commit the version number, tag, and publish the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the version
        run: |
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists. Pick the next version number."
            exit 1
          fi

      - name: Raise the version and write the release notes
        run: python3 tools/release/bump.py "$VERSION" --notes "$RUNNER_TEMP/release-notes.md"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Put the signing key in place
        env:
          KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ORBIT_KEYSTORE_BASE64 secret is missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/orbit-release.jks"

      - name: Signed release APK
        env:
          ORBIT_KEYSTORE_FILE: ${{ runner.temp }}/orbit-release.jks
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "orbit-$VERSION.apk"
          echo "APK=orbit-$VERSION.apk" >> "$GITHUB_ENV"

      # An update only installs over the previous version if it's signed with the same key
      - name: Check it's signed with the same key as v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          digest() { "$tools/apksigner" verify --print-certs "$1" | grep -m1 'SHA-256 digest' | sed 's/.*: //'; }
          gh release download v0.1.0 --pattern '*.apk' --dir "$RUNNER_TEMP/v0.1.0"
          new=$(digest "$APK")
          old=$(digest "$(ls "$RUNNER_TEMP"/v0.1.0/*.apk | head -1)")
          echo "This build: $new"
          echo "v0.1.0:     $old"
          if [ -z "$new" ] || [ "$new" != "$old" ]; then
            echo "::error::This APK isn't signed with the same key as v0.1.0, so it wouldn't install over it"
            exit 1
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/orbit-release.jks"

      # Only now, with a good signed APK in hand, does anything change on GitHub
      - name: Commit the new version and tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md
          git commit -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "Orbit $VERSION"
          git push origin "HEAD:${{ github.ref_name }}" "v$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$APK" \
            --title "Orbit $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
          echo "Published https://github.com/${{ github.repository }}/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
