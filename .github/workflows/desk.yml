# Tests Orbit Desk (desk/orbit_desk.py: screen sharing, agent news, the MCP server) on Windows,
# macOS and Linux, with the oldest and newest Python it supports. Only the cryptography add-on is
# needed (screen capture isn't tested; the agent commands are also tested without cryptography).
name: Orbit Desk

on:
  push:
    branches: [main]
    paths: ['desk/**', '.github/workflows/desk.yml']
  pull_request:
    paths: ['desk/**', '.github/workflows/desk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install cryptography
        run: python -m pip install "cryptography>=42.0"
      - name: Tests
        run: python -m unittest discover -s desk -v
